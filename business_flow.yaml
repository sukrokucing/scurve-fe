version: "2.1"
source_document: "CAPABILITIES.md"
draft_note: "Capability-first executable draft with CRUD flows"

config:
  base_url: "http://localhost:3001"
  generated_spec: "e2e/generated/business-flow.generated.spec.ts"

credentials:
  username:
    env:
      - PLAYWRIGHT_USERNAME
      - TEST_EMAIL
  password:
    env:
      - PLAYWRIGHT_PASSWORD
      - TEST_PASSWORD

variables:
  RUN_SUFFIX: "${RUN_ID}"
  PROJECT_NAME: "Flow Project CRUD ${RUN_SUFFIX}"
  PROJECT_DESCRIPTION_CREATE: "Created by capability-based business_flow.yaml (${RUN_SUFFIX})"
  PROJECT_DESCRIPTION_UPDATE: "Updated by capability-based business_flow.yaml (${RUN_SUFFIX})"
  PROJECT_RATE_OVERRIDE: "123.45"
  PROJECT_RATE_CURRENCY: "IDR"
  TASK_TITLE: "Flow Task CRUD ${RUN_SUFFIX}"
  TASK_TITLE_UPDATED: "Flow Task CRUD Updated ${RUN_SUFFIX}"
  ROLE_NAME: "flow_role_crud_${RUN_SUFFIX}"
  ROLE_DESCRIPTION: "Role created by capability-based business_flow.yaml (${RUN_SUFFIX})"

action_library:
  # -------- Auth --------
  goto_login:
    kind: goto
    url: /login
    description: Open login page
  fill_login_email:
    kind: fill
    locator:
      by: role
      role: textbox
      name: Email
    value_from_credential: username
    description: Fill login email from .env
  fill_login_password:
    kind: fill
    locator:
      by: role
      role: textbox
      name: Password
    value_from_credential: password
    description: Fill login password from .env
  click_sign_in:
    kind: click
    locator:
      by: role
      role: button
      name: Sign in
    description: Submit login form
  ensure_authenticated:
    kind: ensure_authenticated
    description: Ensure session is authenticated using configured credentials
  expect_dashboard_heading:
    kind: expect_visible
    locator:
      by: role
      role: heading
      name: Dashboard
    timeout_ms: 15000
    description: Dashboard heading is visible

  # -------- Dashboard --------
  goto_dashboard:
    kind: goto
    url: /
    description: Open dashboard
  expect_dashboard_project_progress:
    kind: expect_visible
    locator:
      by: text
      text: Project Progress
    description: Dashboard project progress chart section is visible

  # -------- Projects (CRUD) --------
  goto_projects:
    kind: goto
    url: /projects
    description: Open projects page
  expect_projects_heading:
    kind: expect_visible
    locator:
      by: role
      role: heading
      name: Projects
    description: Projects heading is visible
  retry_projects_if_backend_failed:
    kind: click_if_visible
    locator:
      by: role
      role: button
      name: Retry
    timeout_ms: 1200
    description: Retry projects query when backend temporarily fails
  open_project_create_dialog:
    kind: click
    locator:
      by: testid
      testid: projects-new-button
    description: Open create project dialog
  expect_project_create_dialog:
    kind: expect_visible
    locator:
      by: role
      role: dialog
      name: Create project
    description: Create project dialog is visible
  expect_project_create_dialog_closed:
    kind: expect_hidden
    locator:
      by: role
      role: dialog
      name: Create project
    timeout_ms: 20000
    description: Create project dialog is closed after successful submit
  fill_project_name:
    kind: fill
    locator:
      by: testid
      testid: projects-create-name-input
    value_template: "${PROJECT_NAME}"
    description: Fill project name
  fill_project_description:
    kind: fill
    locator:
      by: testid
      testid: projects-create-description-input
    value_template: "${PROJECT_DESCRIPTION_CREATE}"
    description: Fill project description
  filter_projects_by_created_name:
    kind: fill
    locator:
      by: testid
      testid: projects-search-input
    value_template: "${PROJECT_NAME}"
    description: Filter projects by created project name
  submit_project_create:
    kind: click
    locator:
      by: testid
      testid: projects-create-submit-button
    description: Submit create project
  expect_created_project_row:
    kind: expect_visible
    locator:
      by: css
      selector: 'tbody tr:has-text("${PROJECT_NAME}")'
    timeout_ms: 15000
    description: Created project row is visible
  open_first_project_dashboard:
    kind: click
    locator:
      by: css
      selector: 'tbody tr:has-text("${PROJECT_NAME}") [data-testid="projects-row-dashboard-link"]'
    description: Open first project dashboard
  open_first_project_settings:
    kind: click
    locator:
      by: css
      selector: 'tbody tr:has-text("${PROJECT_NAME}") [data-testid="projects-row-settings-link"]'
    description: Open first project settings
  expect_project_settings_page:
    kind: expect_visible
    locator:
      by: testid
      testid: project-settings-page
    description: Project settings page is visible
  expect_project_settings_members_section:
    kind: expect_visible
    locator:
      by: testid
      testid: project-settings-members-section
    description: Project settings members section is visible
  open_project_settings_resource_rates_tab:
    kind: click
    locator:
      by: testid
      testid: project-settings-tab-resource-rates
    description: Open resource rates tab
  expect_project_settings_resource_rates_section:
    kind: expect_visible
    locator:
      by: testid
      testid: project-settings-resource-rates-section
    description: Project settings resource rates section is visible
  fill_project_settings_rate_hourly:
    kind: fill
    locator:
      by: testid
      testid: project-settings-rate-hourly-input
    value_template: "${PROJECT_RATE_OVERRIDE}"
    description: Fill project resource rate override hourly value
  open_project_settings_rate_currency_combobox:
    kind: click
    locator:
      by: testid
      testid: project-settings-rate-currency-combobox
    description: Open project settings rate currency combobox
  select_project_settings_rate_currency:
    kind: click_if_visible
    locator:
      by: css
      selector: '[cmdk-item]:has-text("${PROJECT_RATE_CURRENCY}")'
      first: true
    timeout_ms: 1200
    description: Select configured project rate currency when available
  select_first_visible_combobox_option:
    kind: click_if_visible
    locator:
      by: css
      selector: "[cmdk-item]:visible"
      first: true
    timeout_ms: 1200
    description: Select first visible combobox option as fallback
  submit_project_settings_rate_save:
    kind: click
    locator:
      by: testid
      testid: project-settings-rate-save-button
    description: Save project resource rate override
  expect_project_settings_rate_override_row:
    kind: expect_visible
    locator:
      by: css
      selector: '[data-testid="project-settings-rate-row"]:has-text("Override")'
      first: true
    timeout_ms: 15000
    description: Project resource rate override row is visible
  reset_project_settings_rate_override:
    kind: click
    locator:
      by: css
      selector: '[data-testid="project-settings-rate-row"]:has-text("Override") [data-testid="project-settings-rate-reset-button"]'
      first: true
    description: Reset first project resource rate override
  open_project_settings_general_tab:
    kind: click
    locator:
      by: testid
      testid: project-settings-tab-general
    description: Open general tab
  expect_project_settings_general_section:
    kind: expect_visible
    locator:
      by: testid
      testid: project-settings-general-section
    description: Project settings general section is visible
  expect_project_dashboard_curve:
    kind: expect_visible
    locator:
      by: text
      text: S-Curve Performance
    description: S-Curve chart section is visible
  open_first_project_edit_dialog:
    kind: goto
    url: /projects
    description: Return to projects page before update
  click_first_project_edit:
    kind: click_if_visible
    locator:
      by: css
      selector: 'tbody tr:has-text("${PROJECT_NAME}") [data-testid="projects-row-edit-button"]'
    timeout_ms: 1200
    description: Open first project edit dialog
  open_first_project_actions_menu:
    kind: click_if_visible
    locator:
      by: css
      selector: 'tbody tr:has-text("${PROJECT_NAME}") [data-testid="projects-row-actions-toggle"]'
    timeout_ms: 1200
    description: Open compact row actions menu when visible (mobile/tablet)
  click_first_project_edit_compact:
    kind: click_if_visible
    locator:
      by: css
      selector: 'tbody tr:has-text("${PROJECT_NAME}") [data-testid="projects-row-compact-edit-button"]'
    timeout_ms: 1200
    description: Open first project edit dialog via compact actions menu
  expect_project_edit_dialog:
    kind: expect_visible
    locator:
      by: role
      role: dialog
      name: Edit project
    description: Edit project dialog is visible
  update_project_description:
    kind: fill
    locator:
      by: testid
      testid: projects-edit-description-input
    value_template: "${PROJECT_DESCRIPTION_UPDATE}"
    description: Update project description
  submit_project_save:
    kind: click
    locator:
      by: testid
      testid: projects-edit-save-button
    description: Save project update
  click_first_project_delete:
    kind: click_if_visible
    locator:
      by: css
      selector: 'tbody tr:has-text("${PROJECT_NAME}") [data-testid="projects-row-delete-button"]'
    timeout_ms: 1200
    description: Open first project delete confirmation
  click_first_project_delete_compact:
    kind: click_if_visible
    locator:
      by: css
      selector: 'tbody tr:has-text("${PROJECT_NAME}") [data-testid="projects-row-compact-delete-button"]'
    timeout_ms: 1200
    description: Open first project delete confirmation via compact actions menu
  expect_project_delete_dialog:
    kind: expect_visible
    locator:
      by: role
      role: dialog
      name: Delete project
    description: Delete project confirmation dialog is visible
  confirm_project_delete:
    kind: click
    locator:
      by: testid
      testid: projects-delete-confirm-button
    description: Confirm project deletion

  # -------- Tasks (CRUD) --------
  goto_tasks:
    kind: goto
    url: /tasks
    description: Open tasks page
  expect_tasks_heading:
    kind: expect_visible
    locator:
      by: role
      role: heading
      name: Tasks
      exact: true
    description: Tasks heading is visible
  open_task_create_dialog:
    kind: click
    locator:
      by: testid
      testid: tasks-new-button
    description: Open create task dialog
  expect_task_create_dialog:
    kind: expect_visible
    locator:
      by: role
      role: dialog
      name: Create task
    description: Create task dialog is visible
  fill_task_title:
    kind: fill
    locator:
      by: testid
      testid: tasks-create-title-input
    value_template: "${TASK_TITLE}"
    description: Fill task title
  submit_task_create:
    kind: click
    locator:
      by: testid
      testid: tasks-create-submit-button
    description: Submit create task
  filter_tasks_by_created_title:
    kind: fill
    locator:
      by: testid
      testid: tasks-search-input
    value_template: "${TASK_TITLE}"
    description: Filter tasks list by created task title
  filter_tasks_by_updated_title:
    kind: fill
    locator:
      by: testid
      testid: tasks-search-input
    value_template: "${TASK_TITLE_UPDATED}"
    description: Filter tasks list by updated task title
  wait_for_tasks_filter_settle:
    kind: wait
    ms: 700
    description: Wait for tasks list filtering and virtualization to settle
  expect_created_task_row:
    kind: expect_visible
    locator:
      by: css
      selector: 'tbody tr:has-text("${TASK_TITLE}")'
    description: Created task row is visible
  switch_task_board_view:
    kind: click
    locator:
      by: testid
      testid: tasks-view-board-button
    description: Switch to board view
  open_tasks_advanced_filters:
    kind: ensure_visible
    locator:
      by: testid
      testid: tasks-advanced-filters-panel
    open_locator:
      by: testid
      testid: tasks-advanced-filters-toggle
    description: Open tasks advanced controls panel
  switch_task_gantt_view:
    kind: click
    locator:
      by: testid
      testid: tasks-view-gantt-button
    description: Switch to gantt view
  expect_gantt_view_mode_combobox:
    kind: expect_visible
    locator:
      by: testid
      testid: gantt-view-mode-combobox
    description: Gantt view mode combobox is visible
  expect_gantt_today_button:
    kind: expect_visible
    locator:
      by: testid
      testid: gantt-today-button
    description: Gantt today button is visible
  open_gantt_advanced_panel:
    kind: ensure_visible
    locator:
      by: testid
      testid: gantt-advanced-panel
    open_locator:
      by: testid
      testid: gantt-advanced-toggle
    description: Open gantt advanced panel
  click_gantt_scroll_left:
    kind: click
    locator:
      by: testid
      testid: gantt-scroll-left-button
    description: Scroll gantt timeline left
  click_gantt_scroll_right:
    kind: click
    locator:
      by: testid
      testid: gantt-scroll-right-button
    description: Scroll gantt timeline right
  click_gantt_toggle_table:
    kind: click
    locator:
      by: testid
      testid: gantt-toggle-table-button
    description: Toggle gantt table visibility
  expect_gantt_dependency_add_button:
    kind: expect_visible
    locator:
      by: testid
      testid: gantt-dependency-add-button
      first: true
    description: Gantt dependency add control is visible
  switch_task_list_view:
    kind: click
    locator:
      by: testid
      testid: tasks-view-list-button
    description: Switch back to list view
  click_first_task_edit:
    kind: click
    locator:
      by: testid
      testid: tasks-row-edit-button
      first: true
    description: Open first task edit dialog
  expect_task_edit_dialog:
    kind: expect_visible
    locator:
      by: role
      role: dialog
      name: Edit task
    description: Edit task dialog is visible
  fill_task_title_updated:
    kind: fill
    locator:
      by: testid
      testid: tasks-edit-title-input
    value_template: "${TASK_TITLE_UPDATED}"
    description: Update task title
  submit_task_save:
    kind: press
    locator:
      by: testid
      testid: tasks-edit-title-input
    key: Enter
    description: Save task update
  click_first_task_delete:
    kind: click
    locator:
      by: testid
      testid: tasks-row-delete-button
      first: true
    description: Open first task delete confirmation
  expect_first_task_delete_button:
    kind: expect_visible
    locator:
      by: testid
      testid: tasks-row-delete-button
      first: true
    timeout_ms: 10000
    description: First task delete action is visible
  expect_task_delete_dialog:
    kind: expect_visible
    locator:
      by: role
      role: dialog
      name: Delete task
    description: Delete task confirmation dialog is visible
  confirm_task_delete:
    kind: click
    locator:
      by: testid
      testid: tasks-delete-confirm-button
    description: Confirm task deletion

  # -------- Roles (CRUD-like: create/read/delete) --------
  goto_roles:
    kind: goto
    url: /settings/roles
    description: Open roles page
  expect_roles_heading:
    kind: expect_visible
    locator:
      by: role
      role: heading
      name: Roles
    description: Roles heading is visible
  open_create_role_dialog:
    kind: click
    locator:
      by: testid
      testid: roles-create-button
    description: Open create role dialog
  expect_create_role_dialog:
    kind: expect_visible
    locator:
      by: role
      role: dialog
      name: Create New Role
    description: Create role dialog is visible
  fill_role_name:
    kind: fill
    locator:
      by: testid
      testid: roles-create-name-input
    value_template: "${ROLE_NAME}"
    description: Fill role name
  fill_role_description:
    kind: fill
    locator:
      by: testid
      testid: roles-create-description-input
    value_template: "${ROLE_DESCRIPTION}"
    description: Fill role description
  submit_role_create:
    kind: click
    locator:
      by: testid
      testid: roles-create-submit-button
    description: Submit role creation
  expect_created_role_row:
    kind: expect_visible
    locator:
      by: css
      selector: 'tbody tr:has-text("${ROLE_NAME}")'
    timeout_ms: 15000
    description: Created role row is visible
  open_super_admin_role_detail:
    kind: click
    locator:
      by: css
      selector: 'tbody tr:has-text("${ROLE_NAME}") [data-testid="roles-row-name-button"]'
    description: Open created role detail
  expect_role_detail_dialog:
    kind: expect_visible
    locator:
      by: css
      selector: '[role="dialog"]'
    description: Role detail dialog is visible
  close_active_dialog:
    kind: click
    locator:
      by: role
      role: button
      name: Close
    description: Close active dialog
  accept_delete_role_confirm:
    kind: accept_dialog_next
    description: Accept browser confirmation for role deletion
  click_first_role_delete:
    kind: click
    locator:
      by: css
      selector: 'tbody tr:has-text("${ROLE_NAME}") [data-testid="roles-row-delete-button"]'
    description: Delete first role row

  # -------- Users / Access Flow / Policy --------
  goto_users:
    kind: goto
    url: /settings/users
    description: Open users page
  expect_users_heading:
    kind: expect_visible
    locator:
      by: role
      role: heading
      name: User Management
    description: Users page heading is visible
  click_first_manage_access_link:
    kind: click
    locator:
      by: testid
      testid: users-row-manage-access-link
      first: true
    description: Open user access page from users table
  expect_user_access_heading:
    kind: expect_visible
    locator:
      by: role
      role: heading
      name: User Access Management
    description: User access heading is visible
  goto_access_flow:
    kind: goto
    url: /settings/flow
    description: Open access flow explorer
  expect_access_flow_heading:
    kind: expect_visible
    locator:
      by: role
      role: heading
      name: Access Flow Explorer
    description: Access flow heading is visible
  click_first_access_flow_user:
    kind: click
    locator:
      by: testid
      testid: access-flow-user-item
      first: true
    description: Select first user in access flow explorer
  click_access_flow_manage_access:
    kind: click
    locator:
      by: testid
      testid: access-flow-manage-access-button
    description: Open user access management from access flow
  goto_policy:
    kind: goto
    url: /settings/policy
    description: Open policy page
  expect_policy_heading:
    kind: expect_visible
    locator:
      by: role
      role: heading
      name: Access Policy
    description: Access policy heading is visible
  open_audit_log_dialog:
    kind: click
    locator:
      by: testid
      testid: policy-audit-log-button
    description: Open audit log dialog
  expect_audit_log_dialog:
    kind: expect_visible
    locator:
      by: role
      role: dialog
      name: System Audit Log
    description: Audit log dialog is visible
  expect_audit_log_next_button:
    kind: expect_visible
    locator:
      by: testid
      testid: policy-audit-log-next-button
    description: Next page control exists in audit log

  # -------- Cleanup helpers --------
  expect_no_created_project_row:
    kind: expect_hidden
    locator:
      by: css
      selector: 'tbody tr:has-text("${PROJECT_NAME}")'
    timeout_ms: 15000
    description: Created project row is no longer visible after deletion

  expect_no_created_task_row:
    kind: expect_hidden
    locator:
      by: css
      selector: 'tbody tr:has-text("${TASK_TITLE_UPDATED}")'
    timeout_ms: 15000
    description: Updated task row is no longer visible after deletion

  expect_no_created_role_row:
    kind: expect_hidden
    locator:
      by: css
      selector: 'tbody tr:has-text("${ROLE_NAME}")'
    timeout_ms: 15000
    description: Created role row is no longer visible after deletion

  confirm_role_delete:
    kind: click
    locator:
      by: testid
      testid: roles-delete-confirm-button
    description: Confirm role deletion in AlertDialog

  # -------- Negative / edge case helpers --------
  fill_login_invalid_email:
    kind: fill
    locator:
      by: role
      role: textbox
      name: Email
    value: "nonexistent@invalid.test"
    description: Fill invalid email for negative login test

  fill_login_invalid_password:
    kind: fill
    locator:
      by: role
      role: textbox
      name: Password
    value: "wrongpassword99"
    description: Fill wrong password for negative login test

  expect_login_error_toast:
    kind: expect_visible
    locator:
      by: text
      text: Login failed
    timeout_ms: 10000
    description: Login failure toast is visible

  expect_login_form_still_visible:
    kind: expect_visible
    locator:
      by: role
      role: button
      name: Sign in
    description: Login form remains visible after failed attempt

  fill_project_name_empty:
    kind: fill
    locator:
      by: testid
      testid: projects-create-name-input
    value: ""
    description: Leave project name empty for validation test

  expect_project_create_validation_error:
    kind: expect_visible
    locator:
      by: text
      text: required
    timeout_ms: 3000
    description: Validation error message is visible

  expect_tasks_empty_state:
    kind: expect_visible
    locator:
      by: text
      text: No tasks
    timeout_ms: 10000
    description: Tasks empty state is visible when no tasks exist

flows:
  # -------- Auth / Dashboard --------
  - id: auth_login_email
    module: authentication
    capability_ref: "1.1 Authentication"
    title: login_using_email_credentials
    actor: app_user
    crud:
      - read
    risk_level: high
    preconditions:
      - env_credentials_available
      - user_account_exists
    steps:
      - use: goto_login
      - use: ensure_authenticated

  - id: dashboard_overview_read
    module: dashboard
    capability_ref: "1.2 Dashboard"
    title: view_dashboard_overview_widgets
    actor: app_user
    crud:
      - read
    risk_level: low
    depends_on:
      - auth_login_email
    preconditions:
      - user_logged_in
    steps:
      - use: goto_dashboard
      - use: expect_dashboard_heading
      - use: expect_dashboard_project_progress

  # -------- Projects CRUD --------
  - id: project_create
    module: project_management
    capability_ref: "1.3 Projects"
    title: create_project_via_projects_page
    actor: app_user
    crud:
      - create
    risk_level: high
    depends_on:
      - auth_login_email
    preconditions:
      - user_logged_in
    steps:
      - use: goto_projects
      - use: expect_projects_heading
      - use: open_project_create_dialog
      - use: expect_project_create_dialog
      - use: fill_project_name
      - use: fill_project_description
      - use: submit_project_create
      - use: expect_project_create_dialog_closed
      - use: goto_projects
      - use: retry_projects_if_backend_failed
      - use: filter_projects_by_created_name
      - use: expect_created_project_row

  - id: project_read_dashboard
    module: project_management
    capability_ref: "1.3 Projects, 1.4 Project Dashboard"
    title: read_project_dashboard_drilldown
    actor: app_user
    crud:
      - read
    risk_level: medium
    depends_on:
      - project_create
    preconditions:
      - at_least_one_project_exists
    steps:
      - use: goto_projects
      - use: retry_projects_if_backend_failed
      - use: filter_projects_by_created_name
      - use: open_first_project_dashboard
      - use: expect_project_dashboard_curve

  - id: project_settings_read
    module: project_management
    capability_ref: "1.3 Projects"
    title: read_project_settings_tabs
    actor: app_user
    crud:
      - read
    risk_level: medium
    depends_on:
      - project_create
    preconditions:
      - at_least_one_project_exists
    steps:
      - use: goto_projects
      - use: retry_projects_if_backend_failed
      - use: filter_projects_by_created_name
      - use: open_first_project_settings
      - use: expect_project_settings_page
      - use: expect_project_settings_members_section
      - use: open_project_settings_resource_rates_tab
      - use: expect_project_settings_resource_rates_section
      - use: open_project_settings_general_tab
      - use: expect_project_settings_general_section

  - id: project_settings_rate_override
    module: project_management
