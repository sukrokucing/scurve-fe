name: Quality Gates

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Table stack guard
        run: npm run qa:tables

      - name: Build
        run: npm run build

      - name: Critical authenticated e2e
        if: ${{ secrets.PLAYWRIGHT_AUTH_TOKEN != '' || (secrets.PLAYWRIGHT_USERNAME != '' && secrets.PLAYWRIGHT_PASSWORD != '') }}
        env:
          PLAYWRIGHT_AUTH_TOKEN: ${{ secrets.PLAYWRIGHT_AUTH_TOKEN }}
          PLAYWRIGHT_USERNAME: ${{ secrets.PLAYWRIGHT_USERNAME }}
          PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
          PLAYWRIGHT_USER_ID: ${{ secrets.PLAYWRIGHT_USER_ID }}
          PLAYWRIGHT_USER_NAME: ${{ secrets.PLAYWRIGHT_USER_NAME }}
          PLAYWRIGHT_USER_EMAIL: ${{ secrets.PLAYWRIGHT_USER_EMAIL }}
        run: npm run test:e2e:critical

      - name: Live project dialogs e2e
        if: ${{ secrets.PLAYWRIGHT_AUTH_TOKEN != '' || (secrets.PLAYWRIGHT_USERNAME != '' && secrets.PLAYWRIGHT_PASSWORD != '') }}
        env:
          PLAYWRIGHT_AUTH_TOKEN: ${{ secrets.PLAYWRIGHT_AUTH_TOKEN }}
          PLAYWRIGHT_USERNAME: ${{ secrets.PLAYWRIGHT_USERNAME }}
          PLAYWRIGHT_PASSWORD: ${{ secrets.PLAYWRIGHT_PASSWORD }}
          PLAYWRIGHT_USER_ID: ${{ secrets.PLAYWRIGHT_USER_ID }}
          PLAYWRIGHT_USER_NAME: ${{ secrets.PLAYWRIGHT_USER_NAME }}
          PLAYWRIGHT_USER_EMAIL: ${{ secrets.PLAYWRIGHT_USER_EMAIL }}
        run: npm run test:e2e:project-dialogs-live

      - name: UI audit gate
        run: npm run audit:ui

      - name: Performance audit gate
        run: npm run audit:perf:strict

      - name: Visual parity gate
        run: npm run visual:compare
